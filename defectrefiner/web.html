<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket review</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3de;
    --accent: #2f5bd3; --accent-text: #ffffff; --ok: #1f7a4d; --warn: #9a5b00; --bad: #b3261e;
    --ok-bg: #e6f4ec; --warn-bg: #fbf0dc; --bad-bg: #fbe7e5; --callout: #f1f4fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9d9c95; --line: #33332f;
      --accent: #7d9cf0; --accent-text: #10131c; --ok: #6cc597; --warn: #e3ac55; --bad: #f08a80;
      --ok-bg: #1b3027; --warn-bg: #33281a; --bad-bg: #3a1f1c; --callout: #1d2333;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 24px; padding: 12px 20px; border-bottom: 1px solid var(--line);
           background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  .stats { display: flex; gap: 18px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 53px); }
  nav { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  nav .label { padding: 14px 16px 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  nav button { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid transparent;
               background: none; color: inherit; padding: 10px 14px; cursor: pointer; font: inherit; }
  nav button:hover { background: var(--bg); }
  nav button.active { border-left-color: var(--accent); background: var(--bg); }
  nav .name { font-size: 12px; color: var(--muted); }
  nav .title { display: block; font-size: 14px; margin: 2px 0 4px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; font-weight: 500; }
  .badge.bug { background: var(--bad-bg); color: var(--bad); }
  .badge.already_fixed, .badge.duplicate { background: var(--ok-bg); color: var(--ok); }
  .badge.not_a_bug, .badge.feature_request { background: var(--warn-bg); color: var(--warn); }
  main { padding: 24px 32px 120px; overflow-y: auto; min-width: 0; }
  article { max-width: 860px; }
  article h1 { font-size: 22px; line-height: 1.3; margin-top: 0; }
  article h2 { font-size: 16px; margin-top: 28px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  article code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  article li { margin: 4px 0; }
  article hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0 12px; }
  article hr ~ p { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  .callout { background: var(--callout); border-radius: 8px; padding: 12px 18px; margin: 0 0 20px; }
  .callout h2 { border: 0; margin: 0 0 4px; font-size: 14px; }
  .callout ul { margin: 0; padding-left: 20px; }
  .actions { position: fixed; bottom: 0; left: 300px; right: 0; display: flex; gap: 10px; align-items: center;
             padding: 12px 32px; background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap; }
  .actions .hint { color: var(--muted); font-size: 13px; margin-left: auto; }
  button.btn { font: inherit; font-weight: 500; padding: 8px 16px; border-radius: 6px; cursor: pointer;
               border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button.btn:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--bad); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .editor { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .editor textarea { width: 100%; min-height: 70vh; font: 13px/1.5 ui-monospace, Menlo, monospace; padding: 12px;
                     border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
  .editor article { border: 1px solid var(--line); border-radius: 6px; padding: 12px 18px; max-height: 70vh; overflow-y: auto; }
  input.reason { flex: 1; min-width: 200px; font: inherit; padding: 8px 10px; border-radius: 6px;
                 border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .empty { color: var(--muted); padding: 40px 0; }
  .toast { position: fixed; top: 64px; right: 20px; background: var(--text); color: var(--bg); padding: 10px 14px;
           border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
    main { padding: 16px 16px 160px; }
    .actions { left: 0; padding: 10px 16px; }
    .actions .hint { display: none; }
    .editor { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Ticket review</h1>
  <div class="stats" id="stats"></div>
</header>
<div class="layout">
  <nav>
    <div class="label">Drafts</div>
    <div id="list"></div>
  </nav>
  <main id="main"></main>
</div>
<div class="actions" id="actions" hidden></div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const LABELS = { bug: "bug", already_fixed: "already fixed", not_a_bug: "not a bug", duplicate: "duplicate", feature_request: "feature request" };
let drafts = [], current = null, openedAt = 0, mode = "read";

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

function badge(triage) {
  const span = document.createElement("span");
  span.className = `badge ${triage || ""}`;
  span.textContent = LABELS[triage] || triage || "?";
  return span;
}

function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"), 2500);
}

async function loadStats() {
  const r = await api("/api/report");
  // Shares leave out quick approvals (under 15 s): too fast to have read the ticket.
  const parts = r.reviewed ? [
    ["Reviewed", r.reviewed], ["Quick approvals", r.quick_approvals], ["Approved as is", r.approved_as_is ?? "–"],
    ["Edited", r.approved_with_edits ?? "–"], ["Rejected", r.rejected ?? "–"],
    ["Median review", `${r.median_review_seconds} s`]] : [["Reviewed", 0]];
  $("stats").replaceChildren(...parts.map(([k, v]) => {
    const s = document.createElement("span"); s.append(`${k} `); const b = document.createElement("b"); b.textContent = v; s.append(b); return s;
  }));
}

async function loadList(select) {
  drafts = await api("/api/drafts");
  $("list").replaceChildren(...drafts.map((d) => {
    const b = document.createElement("button");
    b.dataset.name = d.name;
    const name = document.createElement("span"); name.className = "name"; name.textContent = d.name;
    const title = document.createElement("span"); title.className = "title"; title.textContent = d.title;
    b.append(name, title, badge(d.triage));
    b.onclick = () => open(d.name);
    return b;
  }));
  if (!drafts.length) {
    current = null; $("actions").hidden = true;
    $("main").innerHTML = '<p class="empty">No drafts left. Every ticket has been reviewed.</p>';
    return;
  }
  open(drafts.some((d) => d.name === select) ? select : drafts[0].name);
}

// Triage and open questions first: they're what the reviewer decides on.
function questionsFirst(html) {
  const article = document.createElement("article");
  article.innerHTML = html;
  const heading = [...article.querySelectorAll("h2")].find((h) => h.textContent.trim() === "Open questions");
  if (heading) {
    const box = document.createElement("div"); box.className = "callout";
    const moved = [heading];
    for (let n = heading.nextElementSibling; n && n.tagName !== "HR" && n.tagName !== "H2"; n = n.nextElementSibling) moved.push(n);
    box.append(...moved);
    const h1 = article.querySelector("h1");
    (h1 ? h1.nextElementSibling : article.firstChild)?.after(box);
  }
  return article;
}

async function open(name) {
  current = await api(`/api/drafts/${encodeURIComponent(name)}`);
  openedAt = performance.now();
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.name === name));
  showRead();
}

function showRead() {
  mode = "read";
  $("main").replaceChildren(questionsFirst(current.html));
  $("main").scrollTop = 0;
  actions([
    button("Approve", "primary", () => decide("approve")),
    button("Edit", "", showEdit),
    button("Reject", "danger", showReject),
    hint("Keys: A approve · E edit · R reject"),
  ]);
}

function showEdit() {
  mode = "edit";
  const area = document.createElement("textarea");
  area.value = current.text;
  const preview = questionsFirst(current.html);
  let timer;
  area.oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => preview.replaceChildren(...questionsFirst((await api("/api/preview", { text: area.value })).html).childNodes), 250);
  };
  const editor = document.createElement("div"); editor.className = "editor"; editor.append(area, preview);
  $("main").replaceChildren(editor);
  area.focus();
  actions([
    button("Save and approve", "primary", () => area.value === current.text ? decide("approve") : decide("edit", { edited: area.value })),
    button("Cancel", "", showRead),
  ]);
}

function showReject() {
  mode = "reject";
  const input = document.createElement("input");
  input.className = "reason"; input.placeholder = "Why reject it? (logged, so the agents can be improved)";
  const go = button("Reject", "danger", () => input.value.trim() && decide("reject", { reason: input.value.trim() }));
  go.disabled = true;
  input.oninput = () => { go.disabled = !input.value.trim(); };
  input.onkeydown = (e) => { if (e.key === "Enter") go.click(); if (e.key === "Escape") showRead(); };
  actions([input, go, button("Cancel", "", showRead)]);
  input.focus();
}

function actions(items) { $("actions").hidden = false; $("actions").replaceChildren(...items); }
function button(text, kind, onclick) { const b = document.createElement("button"); b.className = `btn ${kind}`; b.textContent = text; b.onclick = onclick; return b; }
function hint(text) { const s = document.createElement("span"); s.className = "hint"; s.textContent = text; return s; }

async function decide(decision, extra = {}) {
  const name = current.name;
  const index = drafts.findIndex((d) => d.name === name);
  try {
    await api(`/api/drafts/${encodeURIComponent(name)}`, { decision, seconds: (performance.now() - openedAt) / 1000, ...extra });
  } catch (e) { toast(`Failed: ${e.message}`); return; }
  toast({ approve: `Approved ${name}`, edit: `Edited and approved ${name}`, reject: `Rejected ${name}` }[decision]);
  const next = drafts[index + 1] || drafts[index - 1];
  await Promise.all([loadList(next && next.name), loadStats()]);
}

document.addEventListener("keydown", (e) => {
  if (mode !== "read" || !current || e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (["a", "e", "r"].includes(key)) e.preventDefault();  // or the letter lands in the box that opens
  if (key === "a") decide("approve"); else if (key === "e") showEdit(); else if (key === "r") showReject();
});

loadList(); loadStats();
</script>
</body>
</html>
