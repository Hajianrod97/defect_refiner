name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6  # Python comes from .python-version
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q  # no API calls: the tests use fake models, so no key is needed
